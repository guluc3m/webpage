# Checks that fortunas.yaml still parses, so a misindented fortuna shows up as
# a red check on the PR instead of silently replacing every fortuna on the site.
name: Fortunas

on:
  pull_request:
    paths:
      - src/data/fortunas.yaml
      - src/lib/fortunas.ts
      - src/lib/fortunas.test.ts
  push:
    paths:
      - src/data/fortunas.yaml
      - src/lib/fortunas.ts
      - src/lib/fortunas.test.ts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only this file, not `pnpm test`: the fortunas check must not go red
      # because of an unrelated test.
      - name: Test fortunas
        run: node --test src/lib/fortunas.test.ts
