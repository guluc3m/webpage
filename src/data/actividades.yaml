- title: Intro Git & Github
  date: 2025/11/12
  type: Taller
  description: >-
    ¿Eres de los que al hacer un trabajo comparte el código por mail o por
    drive? ¿Has oído hablar de Github pero nunca has tenido claro qué es y
    cómo funciona? Cambia esto y aprende a trabajar con control de versiones
    como un profesional. En este taller, junto con GUL, aprenderemos que es
    Git y por qué hemos de usarlo. Aprenderemos conceptos claves y
    trabajaremos de manera colaborativa a través de una simulación en equipo
    donde podrás poner en práctica todo lo aprendido.
  poster: https://pbs.twimg.com/media/G5BArDEXMAASmED?format=jpg&name=900x900
  participants:
    - name: Albert Giurgiu
      link: https://github.com/fedes1to
    - name: Guillermo González
      link: https://github.com/giyermo
  video: https://www.youtube.com/watch?v=oDJsZ8ywq0o
  tags: [Git]

