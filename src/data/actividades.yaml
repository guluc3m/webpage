- title: Espiando procesos en Linux
  description: >-
    En muchas ocasiones nos encontramos que nuestro programa no funciona como
    esperábamos ʕノ•ᴥ•ʔノ ︵ ┻━┻. A veces el consumo de CPU es demasiado alto. En
    otras ocasiones no obtenemos una respuesta esperada por la red. Quizás los
    logs no se escriben donde debieran... o peor aún, el proceso parece estar
    parado sin motivo aparente. En esta charla veremos, con ejemplos prácticos,
    algunas de las herramientas que empecé a usar (este verano yayyy!) para
    investigar nuestros programas.  Aunque pueda parecer que sólo tiene
    aplicación en el mundo de sistemas o de bajo nivel, veremos cómo esto es
    súper útil (y apasionante!!! :D) en lenguajes de (muy?) alto nivel (en mi
    caso, Ruby) y en situaciones en las que todos nos encontramos como
    programadores :)
