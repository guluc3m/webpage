- title: 'Taller presencial: Introduccion a C'
  date: 2026/02/18
  description: >-
    ¿Qué es un Makefile?, ¿Por qué los punteros son tan complicados?, ¿¿Desde
    cuándo puedo usar funciones como argumentos?? Tranquilo, nosotros también
    hemos pasado por esa etapa, y te vamos a ayudar a que sufras lo menos
    posible este miércoles 18 de febrero, a las 13:00 en el aula 2.3.C01. No
    te preocupes, vas a salir de aquí con más dudas sobre punteros que cuando
    entraste, pero esa es la parte divertida del lenguaje.
