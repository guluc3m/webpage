# yaml-language-server: $schema=schema/actividades.schema.json
# Lista de actividades del GUL. Edita esta lista para añadir/quitar eventos. Los campos son:
# - title
# - date (yyyy/mm/dd)
# - type (uno de: Charla, Taller, Hackathon, Install party, Game jam, Pódcast, Jornadas Técnicas, Congreso, Feria de Asociaciones)
# - poster?
# - link?
# - source?
# - slides?
# - photos? (lista de fotos del evento; con cartel, se ven al pulsarlo)
# - tags? (lista)
# - participants? (`{name, link}` o, si nombre ya existe, nombre directo y se reutiliza el link)
#
# Las Jornadas Técnicas (y en general los congresos) ya no se listan aquí:
# son agrupaciones de actividades y viven en congresos.yaml.

