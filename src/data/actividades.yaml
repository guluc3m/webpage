- title: De cero a mantener la calma en LINUX
  description: >-
    El propósito de la actividad es que los asistentes se familiaricen con el
    Sistema Operativo Linux, especialmente en su entorno de consola, para que
    las prácticas de la carrera desarrolladas en este entorno les sean menos
    costosas. Se trabajarán conjuntos de comandos básicos, conjuntos de comandos
    avanzados y se darán consejos útiles. Será impartido por estudiantes y
    ex-estudiantes de la UC3M, algunos con más de 10 años de experiencia en
    LINUX y que son conocedores de la formación complementaria conveniente.
  date: 2016/10/03 # me invento el día
  type: Charla
  tags: [Linux, Terminal]

- title: Una radio a tu alcance
  description: >-
    La actividad consiste en la realización de un programa de radio en directo
    por parte de Dj Tango, locutor, productor y dj con 16 años de experiencia.
    Durante el desarrollo del programa, Tango aportará su visión del medio
    radiofónico desde su experiencia. Se profundizará en conceptos clave y al
    finalizar el programa, se organizará un coloquio con los asistentes. Tango
    ha trabajado en LOCA FM, siendo uno de los facilitadores de su expansión
    nacional y ha fundado laisla.fm, una radio únicamente online financiada
    mediante crowfunding. Su programa La Isla ha sido galardonando cuatro veces
    como mejor programa de radio en directo en los premios nacionales de música
    electrónica VMA.
    de los participantes.
  type: Taller
  tags: [Radio]
  date: 2016/10/06 # me invento el día
  participants:
    - name: Sixto Fernández
      link: https://twitter.com/djtangosix

