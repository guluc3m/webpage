    las prácticas de la carrera desarrolladas en este entorno les sean menos
    costosas. Se trabajarán conjuntos de comandos básicos, conjuntos de comandos
    avanzados y se darán consejos útiles. Será impartido por estudiantes y
    ex-estudiantes de la UC3M, algunos con más de 10 años de experiencia en
