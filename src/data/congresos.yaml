    - title: Inteligencia Artificial aplicada a videojuegos de estrategia en tiempo real
      type: Charla
      date: 2014/11/11
      description: Una visita guiada rápida al mundo de la inteligencia artificial aplicada a juegos de estrategia en tiempo real (Age of Empires, Starcraft II, Risk...). Consistirá en una introducción a las técnicas aplicadas para esta problemática con un recorrido por los principales desafíos a los que ha enfrentado en los últimos años y problemas que surgen para el futuro. ( técnicas que pasan por aprendizaje por refuerzo, algoritmos evolutivos, data mining aplicado a aprendizaje automático, uso de automatas finitos (FSM) , CBR models, semi modelos ocultos de markov (HSMM), entre otros muchos ). La charla concluirá con un ejemplo práctico de agente inteligente en el juego de estrategia RISK. Se analizará el agente y su proceso de diseño, y se probará la eficacia en directo.
      tags:
