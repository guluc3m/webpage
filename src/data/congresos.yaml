    - title: Destripando la blockchain
      date: 2018/04/09
      type: Charla
      description: >-
        En esta charla se explicará el funcionamiento de la blockchain en Bitcoin explicando todos los conceptos básicos para que cualquier estudiante, tanto informático como no informático, pueda entender el mecanismo de la tecnología blockchain.
      tags:
        - Blockchain
      participants:
        - Alfredo Nunez

    - title: Introducción a Python
      date: 2018/04/09
      type: Taller
      description: >-
        Python es el cuarto lenguaje de programación más usado en el mundo (Fuente: Tiobe, 2018). Siendo el lenguaje de script preferido entre la comunidad de programadores internacional. Python destaca como lenguaje de programación en áreas como la administración de sistemas, inteligencia artificial y la ciencia en general. También tiene una comunidad amplia en otras áreas como la programación web, videojuegos, ... Hemos seleccionado un buen número de ejemplos python, para demostrar las capacidades del lenguaje en las diferentes áreas de la computación.
      tags:
        - Python
      source: https://github.com/davidam/python-examples
      participants:
        - name: David Arrollo
          link: https://twitter.com/davidam9

    # se cayó wey
