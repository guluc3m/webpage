# yaml-language-server: $schema=schema/congresos.schema.json
# Congresos del GUL: agrupaciones de actividades, de un tipo y con número de
# edición (p.ej. las Jornadas Técnicas XXXV). Edita esta lista para añadir o
# quitar congresos. Los campos son:
# - title (p.ej. "XXIV Jornadas Técnicas")
# - type (uno de: Jornadas Técnicas, GUL Jamón)
# - edition (número de la edición del tipo)
# - poster? (el cartel del congreso; las activities no llevan el suyo)
# - url? (web del congreso, si la hay)
# - activities (charlas y talleres del congreso; mismos campos y reglas que en
#   actividades.yaml: date yyyy/mm/dd, participants reutilizan links, etc.)

