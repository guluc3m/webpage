    - title: Desarrollo web express con Grails 3
      description: Usando el framework libre Grails, se propone la realización de una aplicación web totalmente funcional desde 0, hasta la creación de su war para ser desplegado en producción. Aplicando y configurando plugins como el de Spring Security Core para la securización, y otros interesantes, pero sobre todo focalizado en saber resolver un futuro desarrollo con otros plugins que sean necesarios.
