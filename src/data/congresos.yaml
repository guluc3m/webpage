# yaml-language-server: $schema=schema/congresos.schema.json
# Congresos del GUL: agrupaciones de actividades, de una serie y con número
# de edición (p.ej. las Jornadas Técnicas XXXV). Edita esta lista para añadir
# o quitar congresos. Los campos son:
# - title (p.ej. "XXIV Jornadas Técnicas")
# - series (la serie del congreso, texto libre: p.ej. "Jornadas Técnicas"; una
#   serie nueva basta con escribirla, no hay lista fija)
# - edition (número de la edición de la serie)
# - poster? (el cartel del congreso; las activities no llevan el suyo)
# - url? (web del congreso, si la hay)
# - activities (charlas y talleres del congreso; mismos campos y reglas que en
#   actividades.yaml: date yyyy/mm/dd, participants reutilizan links, etc.)

