    - title: Testing, motherf*cker, you speak it?
      date: 2019/03/19
      type: Charla
      tags: [Software]
      description: >-
        Hay muchísimo miedo alrededor del testing. Por un lado no se aprende muy bien en la Universidad. Por otro, las empresas se organizan fatal y los tests incordian más que ayudan. La gente aprende que los tests son sinónimo de sufrimiento, y los evita a toda costa. Sin embargo, aprender a hacer tests te convierte en mejor programador. Mejor código y bajo control. Nada de churros incomprensibles. Nada de hackers creídos. Nada de "en mi máquina funciona, lo estarás haciendo mal".
      participants:
        - David Muñoz Díaz

    - title: Vim escape room
      date: 2019/03/20
      type: Taller
      tags: [Vim]
      description: >-
        Vim es un editor de texto desde terminal realmente potente, su aprendizaje es clave para mejorar tu eficiencia y tu productividad en entornos Linux. A través de un taller práctico, partiremos desde cero, hasta la utilización de algunos plugins que hacen de Vim un editor realmente completo.
      participants:
        - Juan Francisco García

    - title: Cómo ser un Jedi Developer
      date: 2019/03/20
      type: Charla
      tags: [Software]
      description: >-
        Hoy en día, con un poco de paciencia y tiempo libre, cualquier persona puede aprender (mejor o peor) a programar, pero, ¿qué es lo que realmente diferencia a un buen desarrollador del resto? En esta charla daré mi opinión y compartiré consejos y cosas que he aprendido desde que dejé la universidad con un punto de vistá pragmático con el objetivo de que todos los asistentens puedan explotar todo su potencial y eviten el lado oscuro de la programación. Esta charla está pensada para ser una versión renovada de la que di en t3chfest 2016.
      participants:
        - name: Rodrigo de Frutos
          link: https://twitter.com/darkrodry

