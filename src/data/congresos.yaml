          link: https://twitter.com/el_piranna
    - title: An Evening with Zoe
      description: Zoe mola. Puedes extenderla como quieras y usando el lenguaje que te dé la gana. Así que hagamos algo chulo con ella. En una Raspberry pi. Con casinos.
