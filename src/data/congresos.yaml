    - title: Gimp Quickies!
      description: GIMP es un potente software de tratamiento digital de imágenes, y además es libre y gratuito, lo que nos hace soñar con unicornios! Sin embargo, la primera impresión que recibimos al abrir el programa puede llegar a ser algo intimidante. No os preocupéis, os enseñaré lo básico para que vuestra primera cita con GIMP sea amor a primera vista.
