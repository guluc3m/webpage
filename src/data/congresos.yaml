- title: XXIX Jornadas Técnicas
  type: Jornadas Técnicas
  edition: 29
  activities:
    - title: SCRUM! De la teoría a la práctica
      description: Todos trabajamos en equipo, todos trabajamos bajo una metodología y desde hace cinco años ¡todos somos ágiles! Es un orgullo decir que hacemos dailys, que dividimos el desarrollo en sprints, que el cliente ve la entrega de valor periódicamente. Pero ¿tenemos todos clara la teoría? ¿se aplica igual en todas las organizaciones? ¿debemos ser esclavos de la metodología?
      date: 2016/11/14
      type: Charla
      tags:
        - SCRUM
      video: https://youtu.be/8OgOA_mP-sw
      slides: https://cloud-gul.uc3m.es/actividades/2016/Noviembre/adrian_scrum_teoria_practica.pdf
      participants:
        - Adrián Casado Rivas
    - title: El mejor lenguaje del mundo
      description: Si quieres aprender cómo se fabrica un lenguaje, un compilador, un DSL o una máquina virtual, esto te interesa.
      date: 2016/11/15
      type: Charla
      tags:
        - Programación
      video: https://youtu.be/9KwWPxBUKKA
      slides: https://cloud-gul.uc3m.es/actividades/2016/Noviembre/david_the_best_language_in_the_world.pdf
      participants:
        - David Muñoz Díaz
    - title: Espiando procesos en Linux
      description: En muchas ocasiones nos encontramos que nuestro programa no funciona como esperábamos ʕノ•ᴥ•ʔノ ︵ ┻━┻. A veces el consumo de CPU es demasiado alto. En otras ocasiones no obtenemos una respuesta esperada por la red. Quizás los logs no se escriben donde debieran... o peor aún, el proceso parece estar parado sin motivo aparente. En esta charla veremos, con ejemplos prácticos, algunas de las herramientas que empecé a usar (este verano yayyy!) para investigar nuestros programas.  Aunque pueda parecer que sólo tiene aplicación en el mundo de sistemas o de bajo nivel, veremos cómo esto es súper útil (y apasionante!!! :D) en lenguajes de (muy?) alto nivel (en mi caso, Ruby) y en situaciones en las que todos nos encontramos como programadores :)
      date: 2016/11/16
      type: Charla
      tags:
        - Linux
      video: https://youtu.be/B7KZHrf1bds
      slides: https://cloud-gul.uc3m.es/actividades/2016/Noviembre/honduco_espiando_procesos_en_linux.pdf
      participants:
        - Javier Honduvilla Coto
    - title: La serpiente que quería sumar
      description: En esta charla haremos una introducción a varias librerías matemáticas de python, tanto enfocadas al cálculo como a las gráficas y la muestra de datos. Veremos tambien un breve repaso a algunas librerías basadas en estas pensadas para machine learning o data science.
      date: 2016/11/16
      type: Charla
      tags:
        - Python
      video: https://youtu.be/TA9esBKswqY
      participants:
        - Axel Blanco
    - title: Mucha más que el dilema del prisionero
      description: El dilema del prisionero, influencias en negociaciones, economía mundial, tensiones politicas. La Teoría de Juegos está presente en muchos aspectos de nuestra vida sin ser del todo conscientes. En esta charla veremos una introducción a esta disciplina y una perpectiva general a los puntos más relevantes de este fascinante área de la matemática.
      date: 2016/11/17
      type: Charla
      tags:
        - Matemáticas
      video: https://youtu.be/jKB2a7Ae-dA
      participants:
        - Clara Luis Miguenza
        - Axel Blanco
    - title: Crakea la ROM y actualiza tu Android
      description: ¿Tu móvil va cada vez más lento? ¿Y si pruebas a cambiarle la instalación que tiene de Android por defecto? Podrías actualizar Android, e incluso, ponerle un Sistema Operativo más ligero (como FirefoxOS, basado en HTML5).
