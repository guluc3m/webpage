- title: XXVI Jornadas Técnicas
  series: Jornadas Técnicas
  edition: 26
  poster: https://pbs.twimg.com/media/CCzOWYCUgAA1Wvx?format=jpg&name=medium
  activities:
    # https://web.archive.org/web/20160422033221/http://cursos.gul.es/xxvi-jornadas-tecnicas-del-gul/

    - title: ¿Conoces a mi amigo Debian?
      date: 2015/05/20
      type: Charla
      description: >-
        Mucha gente es reacia al uso de un sistema operativo, no particularmente Linux, si no diferente a Windows. Y la única razón de esto muchas veces es que Windows es algo conocido, familiar, donde nos sentimos cómodos, y usar otro sistema genera inseguridad porque no sabemos donde están las cosas y lo que resultaba algo intuitivo ya no lo es. Con esta charla/Taller pretendo presentaros un SO Linux, Debian concretamente, recién instalado, explicando también como instalarlo junto a un Windows, e ir conociéndolo desde el principio para perder ese pánico inicial y descubrir muchas de las cosas que este buen compañero de aventuras es capaz de ofrecernos.
      tags:
        - Linux
        - Debian
      participants:
        - name: Adrián Borja Pimentel
          link: https://twitter.com/SeindElBardo

    - title: "Markdown & Pandoc: not another Word"
      description: >-
        Memorias, trabajos, escritos académicos en general... todos hemos tenido que escribirlos alguna vez y hemos sufrido las consecuencias de usar Word, Writer u otro tipo de editor del mismo estilo: márgenes, tablas, alineación, alineación de tablas, márgenes, problemas de formato, gráficos, más márgenes... En esta pequeña charla presentaremos una posible alternativa a estas herramientas "tradicionales". Usando Markdown para escribir el contenido, Pandoc para poder transformar ese contenido a una gran variedad de formatos y una pizca de LaTex si nos gusta darle un poco de emoción a las cosas, obtendremos una forma fácil y rápida (e incluso divertida) de escribir documentos. Además hablaremos de Markdown Slides, una utilidad con la que podréis crear presentaciones de diapositivas en diferentes formatos y con aspecto más que profesional. ¡Y todo ello usando Markdown! ¿Es que se puede pedir más?
      date: 2015/05/20
      type: Charla
      tags:
        - Pandoc
      video: https://youtu.be/PLWgBZGFMeA
      source: https://github.com/asanzdiego/markdownslides
      participants:
        - Rafael Medina García
        - name: Adolfo Sanz de Diego
          link: https://twitter.com/asanzdiego

    - title: The Graphs of Wrath
      description: >-
        En esta charla explicaré conceptos de grafos sociales a un nivel introductorio y no excesivamente técnico. Explicaré cómo conceptos de la teoría de grafos se aplican a grafos sociales para extraer valor sociológico de una estructura fundamentalmente matemática / computacional; y podrás entender a qué se debe la típica afirmación de que "el mundo es un pañuelo". Haré una demo con algunos grafos reales extraídos de Facebook para que los asistentes puedan ver cómo claramente se identifican las comunidades de usuarios dentro la red social. Además, emplearemos la herramienta opensource Gephi para realizar todas estas operaciones.
      date: 2015/05/21
      type: Charla
      tags:
        - Matemáticas
      video: https://youtu.be/lvtVStnxiws
      participants:
        - name: Alejandro Baldominos
          link: https://bal.do/

    - title: Programación Literaria
      date: 2015/05/21
      type: Charla
      description: >-
        La programación literaria es un modelo extraordinariamente eficaz. En palabras de Donald Knuth: "sirve para hacer los programas por fin bien" y tiene innumerables aplicaciones. Su importancia, sin embargo, ha resultado más o menos desapercibida a pesar de que, quien la practica, urge a otros a considerarla por el impacto positivo en su trabajo. En la presentación se mostrará el principio de la programación literaria, así como algunas herramientas y, por fin, se discutirán dos casos reales para la generación de documentos... de un modo muy especial, ¡usando programación literaria!
      tags:
        - Software
      photos:
        - https://pbs.twimg.com/media/CDH4WoYWYAEsMNu?format=jpg&name=medium
      participants:
        - name: Carlos Linares
          link: https://twitter.com/Phovox

    - title: Sé cool, usa programación funcional
      date: 2015/05/21
      type: Charla
      description: >-
        ¿Estás cansado de no ser lo suficientemente cool? ¿Hacer concurrencia es un infierno? ¿Te faltan paréntesis en tu vida? ¿Siempre se te olvidan casos que probar en tus test? ¿No recuerdas cuándo fue la última vez que usaste un patrón de diseño? Si tienes estas inquietudes o simplemente curiosidad te recomiendo que vengas a esta charla. Empezaré explicando conceptos sencillos de programación funcional (como la inmutabilidad), hasta conceptos más avanzados como las monadas. Usaré para los ejemplos Scala, pero mostraremos ejemplos de Programación funcional en otros lenguajes. El objetivo de este taller, es mostrarte lo fácil e interesante que es aplicar aspectos de programación funcional a tu código para mejorar tu código. Y volver a ser el mas cool de la empresa.
      tags:
        - Programación Funcional
        - Scala
      participants:
        - Ignacio Navarro

    - title: JavaScript, JS everywhere!
      description: >-
        Lo más hipster del front-end y del back-end con JS. Preparad vuestras gafas de pasta, vuestra camisa de leñador y ese MacBook (con Linux instalado) que tanto os gusta lucir, esto va a ser divertido. En esta charla se introducirán las librerías y frameworks más actuales para construir aplicaciones web. AngularJS está pegando fuerte, no es para menos, hacer aplicaciones totalmente reactivas es bastante sencillo gracias a este framework. También tenemos #Polymer, #Ember.js y #Backbone.js así que también hablaremos de ellos. En el servidor, alabamos a #NodeJS y su MAGIA. Disponemos de los frameworks #Express y #Koa entre otros. Resulta que los #WebSockets son nuestros nuevos amigos para enviar y recibir datos entre el cliente y el servidor en tiempo real. #Socket.io está para echarnos una mano. Parece que son muchos nombres, pero no os asustéis, sólo se dará una visión superficial. Se resolverán preguntas del tipo: ¿Por cuál empiezo?, ¿Me olvido ya de otros lenguajes para la web?, ¿Podemos jugar al Pókemon desde el navegador entre varios?
      date: 2015/05/23
      type: Charla
      tags:
        - JavaScript
      video: https://youtu.be/n-AOqHFxuv8
      link: http://yago.me/gul2015
      participants:
        - name: Yago Pérez
          link: https://twitter.com/yag_91

    - title: Programando en Android Wear
      description: >-
        Rápida revisión de las familias de wearables y nos centraremos en la programación de aplicaciones con Android Wear. Veremos el estado actual de las diferentes familias de wearables, y haremos una aplicación en Android Wear. Hablaremos de las condiciones especiales en las que se usan las aplicaciones en wearables y cómo hacer apps adaptadas a su pantalla limitada por el tamaño, basar la entrada de datos en comandos por voz, explicaremos las formas de comunicarnos con el móvil dentro de la app para tener conectividad y balancear la carga de procesos entre el móvil y el reloj. Explicaremos también cómo dar funcionalidades de wearable fácilmente una app de móvil mediante las notificaciones y todo ello mediante ejemplos que haremos directamente en Android Studio.
      date: 2015/05/23
      type: Charla
      tags:
        - Android
      video: https://youtu.be/MZFuHoo9b4E
      participants:
        - name: Daniel Rojo
          link: https://twitter.com/akey

    - title: OpenSource, Innovación y empresa
      description: >-
        Charla acerca de la innovación y de los caminos para poder competir como pequeña empresa, contra las grandes empresas utilizando herramientas como el código abierto. No es una charla técnica, sino una aproximación al proceso de emprender visto desde la innovación tecnológica. Como los procesos creativos basados en código abierto, o en ecosistemas colaborativos, pueden desembocar en proyectos empresariales con éxito.
      date: 2015/05/24
      type: Charla
      tags:
        - Software Libre
      video: https://youtu.be/6hCQ_k6Twuc
      participants:
        - name: Sancho Lerena
          link: https://twitter.com/slerena

    - title: Tu primera máquina virtual
      description: >-
        Pequeña introducción a la gestión de máquinas virtuales, ya sea en el ámbito personal o en el de servidores: creación, inicio, gestión de recursos, etc. Así como algunos ejemplos de tecnología disponibles para ello.
      date: 2015/05/24
      type: Charla
      tags:
        - Virtualización
      video: https://youtu.be/ydfHZMVr-Lg
      participants:
        - Axel Blanco

    - title: Monta tu propio ordenador
      type: Taller
      date: 2015/05/24
      description: >-
        ¿Te gustaría saber qué lleva la caja de tu ordenador por dentro? ¿Alguna vez te has planteado que te gustaría montarte un ordenador por piezas pero no tenías muy claro cómo? La charla iría orientada a todos aquellos que alguna vez se han planteado alguna de estas dos cuestiones. Empezaríamos describiendo cuáles son los componentes que (valga la redundancia) componen un ordenador y cuál es la función de cada uno de ellos para a continuación ir viendo cuáles son los criterios para elegir unos componentes u otros a la hora de querer montar un ordenador por piezas. Por último, se montaría rápidamente un ordenador en la propia charla a modo de pequeña demostración.
      tags:
        - Hardware
      participants:
        - Óscar Seguro Alonso

