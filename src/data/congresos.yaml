    - title: Extendiendo Kubernetes
      date: 2018/04/11
      type: Charla
      description: >-
        Esta charla está pensada para explicar cómo se puede extender Kubernetes para tener piezas específicas que cumplan nuestros requisitos. Hablaremos de los problemas a los que hay que enfrentarse y los beneficios que se pueden obtener. Además, explicaremos un proyecto que hemos llevado a cabo, las diferentes iteraciones que hemos hecho para mejorarlo, y lo que hemos aprendido gracias a ello. Por último, comentaremos una librería que hemos creado para que cualquiera pueda construir su propio controlador de una forma rápida y sencilla.
